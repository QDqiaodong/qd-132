server:
  port: 8162

spring:
  application:
    name: space-museum
  
  datasource:
    url: jdbc:mysql://localhost:3368/example_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: admin
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  data:
    redis:
      host: localhost
      port: 6441
      timeout: 6000ms

logging:
  level:
    com.example.spacemuseum: DEBUG
    org.hibernate.SQL: DEBUG