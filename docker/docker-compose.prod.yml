version: '3.8'

services:
  mysql:
    image: ${DOCKER_REGISTRY:-docker.io}/mysql:8.0
    container_name: space-museum-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: example_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3368}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - museum-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${DOCKER_REGISTRY:-docker.io}/redis:7-alpine
    container_name: space-museum-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6441}:6379"
    volumes:
      - redis_data:/data
    networks:
      - museum-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: space-museum-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/example_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8212}:8162"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - museum-network
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: space-museum-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8202}:80"
    depends_on:
      - backend
    networks:
      - museum-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  museum-network:
    driver: bridge
